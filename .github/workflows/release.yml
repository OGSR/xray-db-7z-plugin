name: Create Release

on:
  workflow_dispatch:
    inputs:
      build-ver:
        description: Build version (tag)
        required: true
        default: v0.0.0

env:
  PLUGIN_NAME: xray-db-7z-plugin

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Create release zip
        run: |
          mkdir -p release/bin
          cp -a artifact/XDB_x64/*.dll release/bin/ || true
          cp -a artifact/XDB_Win32/*.dll release/bin/ || true
          cp LICENSE NOTICE release/ || true
          mkdir -p release/licenses
          cp third_party/7zip/DOC/License.txt release/licenses/7zip-License.txt || true
          cd release
          zip -r ../${{ env.PLUGIN_NAME }}-${{ github.event.inputs.build-ver }}.zip .
          cd ..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.build-ver }}
          name: ${{ github.event.inputs.build-ver }}
          files: |
            ${{ env.PLUGIN_NAME }}-${{ github.event.inputs.build-ver }}.zip
          draft: false
          prerelease: false
          make_latest: true
